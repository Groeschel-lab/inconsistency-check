name: release

# Build a self-contained package for WEBSITE_RUN_FROM_PACKAGE.
# Tagged builds publish app.zip as a GitHub release asset.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Vendor Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --target .python_packages/lib/site-packages \
            --platform manylinux2014_x86_64 --platform manylinux_2_17_x86_64 --platform manylinux_2_28_x86_64 \
            --implementation cp --python-version 3.11 --only-binary=:all: --upgrade

      - name: Package app.zip (Azure Functions app)
        run: |
          zip -r app.zip host.json HttpTrigger requirements.txt backend frontend .python_packages \
            -x '*/__pycache__/*' '*.pyc'
          ls -lh app.zip

      - name: Publish app.zip to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app.zip

      - name: Upload app.zip as build artifact (manual runs)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: app.zip
